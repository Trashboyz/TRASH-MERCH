<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRASH MERCH | Underground Streetwear</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fonte estilo gótico/punk do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Cabeçalho / Navegação -->
    <header>
        <div class="logo-container">
            <!-- COLOQUE O NOME DA SUA IMAGEM AQUI NO SRC -->
            <img src="logo.jpg.jpeg" alt="TRASHBOYZ RECORDS" class="logo">
        </div>
        <nav>
            <a href="#loja">LOJA</a>
            <a href="#artistas">ARTISTAS</a>
        </nav>
    </header>

    <!-- Seção Hero (Destaque) -->
    <section class="hero">
        <h1>TRASH MERCH</h1>
        <p>Roupas para quem não segue as regras.</p>
        <a href="#loja" class="btn">VER COLEÇÃO</a>
    </section>

    <!-- Seção da Loja (Produtos) -->
    <section id="loja" class="container">
        <h2 class="section-title">// STREETWEAR</h2>
        
        <!-- Aqui o JavaScript vai injetar os produtos -->
        <div class="grid-produtos" id="lista-produtos">
            <!-- Os cards vão aparecer aqui -->
        </div>
    </section>

    <!-- Seção de Artistas -->
    <section id="artistas" class="container artistas-section">
        <h2 class="section-title">// ARTISTAS</h2>
        <div class="card-artista">
            <h3>TRASHBOYZ RECORDS</h3>
            <p>A voz das ruas. Conheça o cast oficial da gravadora.</p>
            <a href="#" class="btn-outline">OUVIR AGORA</a>
        </div>
    </section>

    <!-- Rodapé -->
    <footer>
        <p>&copy; 2024 TRASH MERCH. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
