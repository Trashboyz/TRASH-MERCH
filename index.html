<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRASH MERCH | Underground Streetwear</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fonte estilo gótico/punk do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Cabeçalho / Navegação -->
    <header>
        <div class="logo-container">
            <!-- COLOQUE O NOME DA SUA IMAGEM AQUI NO SRC -->
            <img src="logo.png.jpeg" alt="TRASHBOYZ RECORDS" class="logo">
        </div>
        <nav>
            <a href="#loja">LOJA</a>
            <a href="#artistas">ARTISTAS</a>
        </nav>
    </header>

    <!-- Seção Hero (Destaque) -->
    <section class="hero">
        <h1>TRASH MERCH</h1>
        <p>Roupas para quem não segue as regras.</p>
        <a href="#loja" class="btn">VER COLEÇÃO</a>
    </section>

    <!-- Seção da Loja (Produtos) -->
    <section id="loja" class="container">
        <h2 class="section-title">// STREETWEAR</h2>
        
        <!-- Aqui o JavaScript vai injetar os produtos -->
        <div class="grid-produtos" id="lista-produtos">
            <!-- Os cards vão aparecer aqui -->
        </div>
    </section>

        <!-- Seção de Artistas -->
    <section id="artistas" class="container artistas-section">
        <h2 class="section-title">// ARTISTAS</h2>
        
        <div class="card-artista" style="display: flex; flex-direction: column; gap: 40px; align-items: center; border: none; padding: 0;">
            
            <!-- ARTISTA 1: AKA. MEMPHIZ -->
            <div style="width: 100%; max-width: 600px;">
                <h3 style="margin-bottom: 15px; text-align: left; font-family: 'Pirata One', cursive; font-size: 2rem;">AKA. MEMPHIZ</h3>
                <iframe style="border-radius:12px" src="https://open.spotify.com/embed/artist/6BGzb5ms7UXjuTV3JlPGCP?utm_source=generator&theme=0" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
                <a href="https://open.spotify.com/artist/6BGzb5ms7UXjuTV3JlPGCP" target="_blank" class="btn-spotify">OUVIR NO SPOTIFY</a>
            </div>

            <!-- ARTISTA 2: MOLDKILLA -->
            <div style="width: 100%; max-width: 600px;">
                <h3 style="margin-bottom: 15px; text-align: left; font-family: 'Pirata One', cursive; font-size: 2rem;">MOLDKILLA</h3>
                <iframe style="border-radius:12px" src="https://open.spotify.com/embed/artist/6gOh71FXkYA1uYwhhGfVM4?utm_source=generator&theme=0" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
                <a href="https://open.spotify.com/artist/6gOh71FXkYA1uYwhhGfVM4" target="_blank" class="btn-spotify">OUVIR NO SPOTIFY</a>
            </div>

            <!-- ARTISTA 3: EDXWARD -->
            <div style="width: 100%; max-width: 600px;">
                <h3 style="margin-bottom: 15px; text-align: left; font-family: 'Pirata One', cursive; font-size: 2rem;">EDXWARD</h3>
                <iframe style="border-radius:12px" src="https://open.spotify.com/embed/artist/5EfBXGEjBZOE8vVXQoEhha?utm_source=generator&theme=0" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
                <a href="https://open.spotify.com/artist/5EfBXGEjBZOE8vVXQoEhha" target="_blank" class="btn-spotify">OUVIR NO SPOTIFY</a>
            </div>

        </div>
    </section>

    <!-- Rodapé -->
    <footer>
        <p>&copy; 2024 TRASH MERCH. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
